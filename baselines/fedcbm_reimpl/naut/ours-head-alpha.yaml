                RUNS="iid=/sc-rwx-vol/fedmedcbm/models/cub/alphasweep/iid a0.05=/sc-rwx-vol/fedmedcbm/models/cub/alphasweep/a0.05 a0.1=/sc-rwx-vol/fedmedcbm/models/cub/alphasweep/a0.1 a0.5=/sc-rwx-vol/fedmedcbm/models/cub/alphasweep/a0.5 a1=/sc-rwx-vol/fedmedcbm/models/cub/alphasweep/a1.0"
                set +e
                python baselines/fedcbm_reimpl/ours_head.py --dataset $DS --concept_file concept_files/cub_filtered.txt --backbone resnet18_cub --clip_name ViT-B/16 --feature_layer features.final_pool \
