              if [ $RC -ne 0 ]; then echo "ERROR: selftest failed, not running"; exit 1; fi

              DS=cub
              OUT=/sc-rwx-vol/fedmedcbm/models/OURS_HEAD_ALPHA/$DS
              mkdir -p $OUT
              mkdir -p data && ln -sfn /sc-rwx-vol/fedmedcbm/datasets/CUB data/CUB
              : # not CIFAR
              CHK="data/CUB/test"
              if [ -n "$CHK" ] && [ ! -e "$CHK" ]; then
                echo "ERROR: raw images not reachable at $CHK"; exit 1
              fi

              for SEED in 42; do
                D=$OUT/s$SEED
                if find "$D" -name metrics.json 2>/dev/null | grep -q .; then
                  echo "[skip] $DS seed $SEED"; continue
