# FedCBM (Yang & Long 2023) on our data and protocol: the F-CM authors'
# reimplementation (github.com/francescoTheSantis/F-CMs, src/fedcbm.py),
# ported to torch in baselines/fedcbm_reimpl/.
#
# GENERATED BY baselines/fedcbm_reimpl/naut/gen_jobs.py -- edit that, not this file.
#
# Variant: local-indep-large.
# Fully local CBMs, independent init, Places365 / ImageNet (GPU).
# cifar10, cifar100, cub: CPU only (8 cores), see CPU_DATASETS in gen_jobs.py.
# Requests sized from measured use (SIZED in gen_jobs.py); Places365 / ImageNet: one Job per seed.
# One Job per dataset; seeds 42, 31, 7; both partitions per seed.
# RESUMABLE: a seed is skipped if its output already has metrics.json.
# Output: /sc-rwx-vol/fedmedcbm/models/LOCAL_CBM_INDEP/<dataset>/s<seed>/<run>/metrics.json
#   partitions.<iid|dirichlet>.global_test_mean_client_acc   (F-CM reference protocol)
#   partitions.<iid|dirichlet>.personalized_test_acc_weighted (per-client test splits)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: local-cbm-indep-places365-s42
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-lfc-cbm
    task: local-cbm-indep
    dataset: places365
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: gpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update -q && apt-get install -y -q git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM
              git -C $WORKSPACE/Label-free-CBM checkout -q fa2869d
              git clone https://github.com/francescoTheSantis/F-CMs.git $WORKSPACE/F-CMs
              git -C $WORKSPACE/F-CMs checkout -q 31cbb14

              export OMP_NUM_THREADS=2 MKL_NUM_THREADS=2
              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas scikit-learn
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              echo "=== selftest vs F-CM reference ==="
              set +e
              python baselines/fedcbm_reimpl/selftest.py --fcm_repo $WORKSPACE/F-CMs > $WORKSPACE/selftest.log 2>&1
              RC=$?; set -e
              grep -v -iE "warn|STOP: TOTAL|Increase the number|scikit-learn.org|Please also refer|n_iter_i" $WORKSPACE/selftest.log || true
              if [ $RC -ne 0 ]; then echo "ERROR: selftest failed, not running"; exit 1; fi

              DS=places365
              OUT=/sc-rwx-vol/fedmedcbm/models/LOCAL_CBM_INDEP/$DS
              mkdir -p $OUT
              export PLACES365_ROOT=/sc-rwx-vol/fedmedcbm/datasets/places365
              : # not CIFAR
              CHK="/sc-rwx-vol/fedmedcbm/datasets/places365/data_256_standard"
              if [ -n "$CHK" ] && [ ! -e "$CHK" ]; then
                echo "ERROR: raw images not reachable at $CHK"; exit 1
              fi

              for SEED in 42; do
                D=$OUT/s$SEED
                if find "$D" -name metrics.json 2>/dev/null | grep -q .; then
                  echo "[skip] $DS seed $SEED"; continue
                fi
                echo ""
                echo "############ FedCBM reimpl | $DS | seed $SEED ############"
                SAVE=$WORKSPACE/out_s$SEED
                case $SEED in
                  42) RUNS="iid=/sc-rwx-vol/fedmedcbm/models/places365/dlamsweep_iid/lam0.000122 dirichlet=/sc-rwx-vol/fedmedcbm/models/places365/dlamsweep/lam0.0001" ;;
                  31) RUNS="iid=/sc-rwx-vol/fedmedcbm/models/SEED_MAIN/places365/iid_s31_nec50 dirichlet=/sc-rwx-vol/fedmedcbm/models/SEED_MAIN/places365/dir_s31_nec50" ;;
                  7) RUNS="iid=/sc-rwx-vol/fedmedcbm/models/SEED_MAIN/places365/iid_s7_nec50 dirichlet=/sc-rwx-vol/fedmedcbm/models/SEED_MAIN/places365/dir_s7_nec50" ;;
                esac
                set +e
                python baselines/fedcbm_reimpl/local_cbm.py --dataset $DS --concept_file concept_files/places365_filtered.txt --backbone resnet50 --clip_name ViT-B/16 --feature_layer layer4 \
                  --val_split 0.05 --num_workers 8 --seed $SEED --num_clients 5 --alpha 0.5 \
                  --partitions iid dirichlet \
                  --annotation_dir /sc-rwx-vol/fedmedcbm/annotations \
                  --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache \
                  --save_dir "$SAVE" --device cuda --runs $RUNS --nec_targets 5 10 20 50 --head_C_grid 0.01 0.1 1.0 --path_refit_iters 1000 --local_init independent
                RC=$?; set -e
                if [ $RC -ne 0 ]; then echo "[FAIL] $DS seed $SEED rc=$RC"; continue; fi
                MD=$(find "$SAVE" -maxdepth 1 -mindepth 1 -type d | head -1)
                mkdir -p "$D" && cp -r "$MD" "$D/"
                echo "[ok] -> $D"
                : # not CIFAR
              done

              echo ""
              echo "=========== SUMMARY: $DS ==========="
              python baselines/fedcbm_reimpl/summarize.py $OUT
              N=$(for S in 42; do find $OUT/s$S -name metrics.json 2>/dev/null; done | wc -l)
              echo "$N/1 seeds have results."
              if [ "$N" -eq 0 ]; then echo "ERROR: no results"; exit 1; fi
          resources:
            requests:
              cpu: "2"
              memory: "48Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "48Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # all >= 24 GB; 11-16 GB cards left out (ImageNet's per-client heads).
                      # A40 / A100 need their own resource names on NRP, so they are not listed.
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-A10
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-L4
                      - Quadro-RTX-6000
                      - NVIDIA-RTX-A5000
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nautilus-ext-gpu01.fullerton.edu  # "GPU is lost" admission errors, 2026-10-15
      restartPolicy: Never
---
