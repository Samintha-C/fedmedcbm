                echo "############ FedCBM reimpl | $DS | seed $SEED ############"
                SAVE=$WORKSPACE/out_s$SEED
                set +e
                python baselines/fedcbm_reimpl/run.py --dataset $DS --concept_file concept_files/imagenet_filtered.txt --backbone resnet50 --clip_name ViT-B/16 --feature_layer layer4 \
                  --val_split 0.05 --num_workers 8 --seed $SEED --num_clients 5 --alpha 0.5 \
                  --partitions iid dirichlet \
                  --annotation_dir /sc-rwx-vol/fedmedcbm/annotations \
                  --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache \
                  --save_dir "$SAVE" --device cuda --svm_balanced --svm_bias --svm_standardize no yes --svm_lr 0.01 0.1 --variant_name strong
                RC=$?; set -e
                if [ $RC -ne 0 ]; then echo "[FAIL] $DS seed $SEED rc=$RC"; continue; fi
                MD=$(find "$SAVE" -maxdepth 1 -mindepth 1 -type d | head -1)
                mkdir -p "$D" && cp -r "$MD" "$D/"
                echo "[ok] -> $D"
                : # not CIFAR
              done

              echo ""
              echo "=========== SUMMARY: $DS ==========="
              python baselines/fedcbm_reimpl/summarize.py $OUT
              N=$(find $OUT -name metrics.json | wc -l)
              echo "$N/3 seeds have results."
              if [ "$N" -eq 0 ]; then echo "ERROR: no results"; exit 1; fi
          resources:
            requests:
              cpu: "12"
              memory: "64Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: "64Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-A10
                      - NVIDIA-A40
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-PCIE-40GB
      restartPolicy: Never
