# Federated dense baseline (no CBL) — CIFAR-100
# Backbone / partition match fedcbm-cifar100-c5-fda.yaml; Phase 3 budget matched.
dataset: cifar100
backbone: resnet50
feature_layer: layer4
clip_name: ViT-B/16

num_clients: 5
num_rounds: 5          # naming only (no Phase 1 here)
alpha: 0.5
iid: false
seed: 31
val_split: 0.1

# Phase 3 FedAvg head (matched to CBM final-layer budget)
final_rounds: 200
final_epochs: 3
final_lr: 0.001
saga_batch_size: 512
extract_batch_size: 256
batch_size: 250
