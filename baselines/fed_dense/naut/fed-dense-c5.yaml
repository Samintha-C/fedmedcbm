# Federated dense (non-CBM) baseline — CIFAR-10 + CIFAR-100
# Frozen backbone + FedAvg dense head. No CBL, no concepts, no DINO annotations.
# Models saved to: /sc-rwx-vol/fedmedcbm/models/{dataset}/baselines/fed_dense/

# ─── cifar10 ─────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: fed-dense-cifar10
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-dense-baseline
    dataset: cifar10
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      containers:
        - name: gpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update && apt-get install -y git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM

              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas pyyaml
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              LOCAL_SAVE=$WORKSPACE/saved_models
              mkdir -p $LOCAL_SAVE

              python baselines/fed_dense/run.py \
                --config baselines/fed_dense/configs/cifar10.yaml \
                --save_dir $LOCAL_SAVE \
                --device cuda

              MODEL_DIR=$(find $LOCAL_SAVE/fully_trained -maxdepth 1 -type d | tail -n +2 | head -1)
              if [ -z "$MODEL_DIR" ]; then
                echo "ERROR: No model directory found in $LOCAL_SAVE/fully_trained"
                exit 1
              fi
              mkdir -p /sc-rwx-vol/fedmedcbm/models/cifar10/baselines/fed_dense
              cp -r "$MODEL_DIR" /sc-rwx-vol/fedmedcbm/models/cifar10/baselines/fed_dense/
              echo "Saved to /sc-rwx-vol/fedmedcbm/models/cifar10/baselines/fed_dense/$(basename $MODEL_DIR)"
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 6Gi
      restartPolicy: Never
  backoffLimit: 0

---
# ─── cifar100 ────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: fed-dense-cifar100
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-dense-baseline
    dataset: cifar100
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      containers:
        - name: gpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update && apt-get install -y git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM

              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas pyyaml
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              LOCAL_SAVE=$WORKSPACE/saved_models
              mkdir -p $LOCAL_SAVE

              python baselines/fed_dense/run.py \
                --config baselines/fed_dense/configs/cifar100.yaml \
                --save_dir $LOCAL_SAVE \
                --device cuda

              MODEL_DIR=$(find $LOCAL_SAVE/fully_trained -maxdepth 1 -type d | tail -n +2 | head -1)
              if [ -z "$MODEL_DIR" ]; then
                echo "ERROR: No model directory found in $LOCAL_SAVE/fully_trained"
                exit 1
              fi
              mkdir -p /sc-rwx-vol/fedmedcbm/models/cifar100/baselines/fed_dense
              cp -r "$MODEL_DIR" /sc-rwx-vol/fedmedcbm/models/cifar100/baselines/fed_dense/
              echo "Saved to /sc-rwx-vol/fedmedcbm/models/cifar100/baselines/fed_dense/$(basename $MODEL_DIR)"
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 6Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-1080Ti
                      - NVIDIA-GeForce-RTX-2080Ti
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-A10
                      - NVIDIA-A40
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-PCIE-40GB
      restartPolicy: Never
  backoffLimit: 0
