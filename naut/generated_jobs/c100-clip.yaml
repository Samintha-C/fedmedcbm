# CIFAR-100 on CLIP-RN50 (VLG-CBM's backbone), IID, ours + the head rule (X27 / D6).
# GENERATED BY naut/gen_c100_clip.py -- edit that, not this file.
#
# One CPU-only Job; seeds 42 31 7 run in sequence (they share the test-set feature cache file).
# RESUMABLE: each stage is skipped if its output is already on the PVC.
# Output: /sc-rwx-vol/fedmedcbm/models/C100_CLIP/cifar100/iid_s<seed>/<run>/        (main_fed.py run)
#         /sc-rwx-vol/fedmedcbm/models/C100_CLIP/cifar100/iid_s<seed>_head/<run>/   (ours_head.py metrics.json)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: c100-clip-iid
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-lfc-cbm
    task: c100-clip
    dataset: cifar100
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: cpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update -q && apt-get install -y -q git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM
              git -C $WORKSPACE/Label-free-CBM checkout -q fa2869d

              export OMP_NUM_THREADS=8 MKL_NUM_THREADS=8
              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas scikit-learn
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              OUT=/sc-rwx-vol/fedmedcbm/models/C100_CLIP/cifar100
              mkdir -p $OUT
              mkdir -p /root/.cache && cp -rn /sc-rwx-vol/fedmedcbm/datasets/torchvision_cifar/. /root/.cache/ 2>/dev/null || true

              for SEED in 42 31 7; do
                D=$OUT/iid_s$SEED
                H=$OUT/iid_s$SEED"_head"
                if find "$D" -name metrics.txt 2>/dev/null | grep -q .; then
                  echo "[skip] cifar100 seed $SEED: run already on the PVC"
                else
                  echo "###### cifar100 | IID | seed $SEED | CLIP-RN50 | CPU ######"
                  SAVE=$WORKSPACE/full_s$SEED
                  mkdir -p "$SAVE"
                  python main_fed.py --dataset cifar100 --concept_file concept_files/cifar100_filtered.txt --backbone clip_RN50 --use_clip_penultimate --clip_name RN50 \
                    --iid --seed $SEED --save_dir "$SAVE" --dual_lam 0.00069 \
                    --val_split 0.1 --batch_size 32 --cbl_lr 5e-4 --cbl_epochs 3 --cbl_batch_size 32 --cbl_pos_weight 0.2 --num_workers 2 --num_clients 5 --num_rounds 5 --local_epochs 5 --lr 1e-3 --weight_decay 1e-5 --device cpu --use_vlg --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache --log_dir /sc-rwx-vol/fedmedcbm/job_logs --cbl_loss_type bce --cbl_optimizer adam --cbl_hidden_layers 0 --cbl_twoway_tp 4.0 --cbl_bb_lr_rate 1.0 --ortho_lambda 100 --final_layer_method feddualavg --final_rounds 200 --final_epochs 3 --final_lr 1e-3 --no_nec_eval
                  MD=$(find "$SAVE/fully_trained" -maxdepth 1 -mindepth 1 -type d | head -1)
                  if [ -z "$MD" ]; then echo "ERROR: no model dir produced"; exit 1; fi
                  mkdir -p "$D" && cp -r "$MD" "$D/"
                  echo "[ok] -> $D"
                fi
                M=$(find "$D" -name metrics.txt | head -1)
                A=$(grep -o '"test_accuracy": [0-9.]*' "$M" | head -1 | cut -d' ' -f2)
                NZ=$(grep -o '"Non-zero weights": [0-9]*' "$M" | head -1 | cut -d' ' -f3)
                awk -v a="$A" -v nz="$NZ" -v k=100 -v s=$SEED \
                  'BEGIN{printf "RESULT cifar100 clip iid s%s plain FedDualAvg acc=%.2f NEC=%.2f\n", s, a*100, nz/k}'

                if find "$H" -name metrics.json 2>/dev/null | grep -q .; then
                  echo "[skip] cifar100 seed $SEED: head rule already on the PVC"; continue
                fi
                echo "###### cifar100 | seed $SEED | head rule (FedDualAvg -> own-support refit) | CPU ######"
                HSAVE=$WORKSPACE/head_s$SEED
                mkdir -p "$HSAVE"
                python baselines/fedcbm_reimpl/ours_head.py --dataset cifar100 --concept_file concept_files/cifar100_filtered.txt --backbone clip_RN50 --use_clip_penultimate --clip_name RN50 \
                  --val_split 0.1 --num_workers 2 --seed $SEED --num_clients 5 --alpha 0.5 \
                  --partitions iid \
                  --annotation_dir /sc-rwx-vol/fedmedcbm/annotations \
                  --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache \
                  --save_dir "$HSAVE" --device cpu --runs iid=$D --extract_batch_size 64 \
                  --lam_mults 0.3 0.55 1.0 1.8 3.3 --refit_rounds 100 --supports own \
                  --lam_targets iid.5:0.0088 iid.50:0.00069
                MH=$(find "$HSAVE" -maxdepth 1 -mindepth 1 -type d | head -1)
                if [ -z "$MH" ]; then echo "ERROR: no head-rule output"; exit 1; fi
                mkdir -p "$H" && cp -r "$MH" "$H/"
                echo "[ok] -> $H"
              done
          resources:
            requests:
              cpu: "8"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 3Gi
      restartPolicy: Never
