apiVersion: batch/v1
kind: Job
metadata:
  name: fedcbm-cblloss-cub-bcebal
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-lfc-cbm
    task: cblloss-sweep
    dataset: cub
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: cpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update -q && apt-get install -y -q git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM
              git -C $WORKSPACE/Label-free-CBM checkout -q fa2869d

              export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4
              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas scikit-learn scipy
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              DS=cub
              O=100
              ARM=bcebal
              SEED=42
              K=200
              D=/sc-rwx-vol/fedmedcbm/models/CBLLOSS_SWEEP/$DS/$ARM
              REFM=$(find /sc-rwx-vol/fedmedcbm/models/cub/dlamsweep/lam0.003 -name metrics.txt -print -quit 2>/dev/null || true)
              mkdir -p $D
              mkdir -p data && ln -sfn /sc-rwx-vol/fedmedcbm/datasets/CUB data/CUB
              : # not CIFAR
              CHK="data/CUB/test"
              if [ -n "$CHK" ] && [ ! -e "$CHK" ]; then
                echo "ERROR: raw images not reachable at $CHK"; exit 1
              fi
              NF=0

              echo ""
              echo "############ $DS | CBL loss $ARM | ortho_lambda $O | dirichlet 0.5 | seed $SEED ############"
              # 1. full pipeline; Phase 3 at the tab:main NEC~50 lambda
              if [ -n "$(find $D -mindepth 2 -maxdepth 2 -name metrics.txt -print -quit)" ]; then
                echo "[skip] main_fed.py"
              else
                SAVE=$WORKSPACE/run
                mkdir -p $SAVE
                python main_fed.py --dataset $DS --concept_file concept_files/cub_filtered.txt --backbone resnet18_cub --clip_name ViT-B/16 --feature_layer features.final_pool \
                  --alpha 0.5 --seed $SEED --save_dir $SAVE --dual_lam 0.003 \
                  --val_split 0.1 --batch_size 32 --cbl_lr 5e-4 --cbl_epochs 15 --cbl_batch_size 32 --cbl_pos_weight 1.0 --num_workers 2 --num_clients 5 --num_rounds 5 --local_epochs 5 --lr 1e-3 --weight_decay 1e-5 --device cpu --use_vlg --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache --log_dir /sc-rwx-vol/fedmedcbm/job_logs --cbl_loss_type bce --cbl_auto_weight --cbl_optimizer adam --cbl_hidden_layers 0 --cbl_twoway_tp 4.0 --cbl_bb_lr_rate 1.0 --ortho_lambda $O --final_layer_method feddualavg --final_rounds 200 --final_epochs 3 --final_lr 1e-3 --no_nec_eval
                MD=$(find $SAVE/fully_trained -maxdepth 1 -mindepth 1 -type d | head -1)
                if [ -z "$MD" ]; then echo "ERROR: main_fed.py left no model dir"; exit 1; fi
                cp -r "$MD" $D/
                echo "[ok] main_fed.py -> $D/$(basename $MD)"
              fi
              RUN=$(dirname "$(find $D -mindepth 2 -maxdepth 2 -name cbl.pt -print -quit)")

              # 2. geometry of the CBL rows (what the penalty acts on)
              if [ -e $D/cbl_weight_geometry.json ]; then
                echo "[skip] weight geometry"
              else
                python -c "import json,sys,torch,torch.nn.functional as F; W=torch.load(sys.argv[1],map_location='cpu')['model.0.weight'].float(); C=W.shape[0]; I=torch.eye(C); Wn=F.normalize(W,dim=1); G=Wn@Wn.T; off=G[I==0].abs(); s=torch.linalg.svdvals(W); p=s/s.sum(); json.dump({'num_concepts':C,'L_ortho':float((G-I).pow(2).mean()),'mean_abs_cos':float(off.mean()),'max_abs_cos':float(off.max()),'frac_abs_cos_above_0.5':float((off>0.5).float().mean()),'eff_rank_W':float(torch.exp(-(p*p.clamp_min(1e-12).log()).sum()))},open(sys.argv[2],'w'),indent=2)" $RUN/cbl.pt $D/cbl_weight_geometry.json \
                  || { echo "[FAIL] weight geometry"; NF=$((NF+1)); }
              fi

              # 3. concept quality vs DINO on the test split (no train-set pass)
              if [ -e $D/cbl_eval_dino.json ]; then
                echo "[skip] evaluate_cbl.py"
              else
                python evaluate_cbl.py --load_dir $RUN --dataset $DS \
                  --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --dino_confidence_threshold 0.10 \
                  --batch_size 128 --num_workers 2 --device cpu \
                  --run_diagnostics --skip_client_geometry --skip_linear_probe \
                  --save_results $WORKSPACE/cbl_eval_dino.json \
                  && cp $WORKSPACE/cbl_eval_dino.json $D/ \
                  || { echo "[FAIL] evaluate_cbl.py"; NF=$((NF+1)); }
              fi

              # 4. the head rule at NEC~5 and NEC~50
              if [ -n "$(find $D/head -name metrics.json -print -quit 2>/dev/null)" ]; then
                echo "[skip] ours_head.py"
              else
                python baselines/fedcbm_reimpl/ours_head.py --dataset $DS --concept_file concept_files/cub_filtered.txt --backbone resnet18_cub --clip_name ViT-B/16 --feature_layer features.final_pool \
                  --val_split 0.1 --num_workers 2 --seed $SEED --num_clients 5 --alpha 0.5 \
                  --partitions dirichlet \
                  --annotation_dir /sc-rwx-vol/fedmedcbm/annotations \
                  --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache \
                  --save_dir $WORKSPACE/head --device cpu --runs dirichlet=$RUN \
                  --supports own --refit_rounds 100 --lam_targets iid.5:0.020 iid.50:0.003 dirichlet.5:0.019 dirichlet.50:0.003 \
                  && mkdir -p $D/head && cp -r $WORKSPACE/head/. $D/head/ \
                  || { echo "[FAIL] ours_head.py"; NF=$((NF+1)); }
              fi

              echo ""
              echo "=========== SUMMARY: $DS CBL loss $ARM ==========="
              for M in $RUN/metrics.txt $REFM; do
                A=$(grep -o '"test_accuracy": [0-9.]*' $M | head -1 | cut -d' ' -f2)
                NZ=$(grep -o '"Non-zero weights": [0-9]*' $M | head -1 | cut -d' ' -f3)
                awk -v n="$M" -v a="$A" -v nz="$NZ" -v k=$K \
                  'BEGIN{printf "  FedDualAvg acc=%6.2f  NEC=%6.2f  %s\n", a*100, nz/k, n}'
              done
              echo "  (second line: tab:main run, BCE pos_weight 0.2, GPU)"
              cat $D/cbl_weight_geometry.json 2>/dev/null || true
              grep -E '^  "(mean_auc_roc|mean_f1_optimal)"|"(effective_rank|mean_abs_pairwise_corr|mean_cohens_d)"' \
                $D/cbl_eval_dino.json 2>/dev/null || true
              if [ $NF -gt 0 ]; then echo "ERROR: $NF step(s) failed"; exit 1; fi
          resources:
            requests:
              cpu: "4"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      restartPolicy: Never
