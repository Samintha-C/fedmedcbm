---
apiVersion: batch/v1
kind: Job
metadata:
  name: fed-dense-imagenet-s7
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-lfc-cbm
    task: fed-dense-seeds
    dataset: imagenet
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: cpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update -q && apt-get install -y -q git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM
              git -C $WORKSPACE/Label-free-CBM checkout -q fa2869d

              export OMP_NUM_THREADS=8 MKL_NUM_THREADS=8
              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas scikit-learn pyyaml
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true

              cd $WORKSPACE/fedmedcbm
              export IMAGENET_ROOT=/sc-rwx-vol/fedmedcbm/datasets/imagenet_kaggle_download/ILSVRC/Data/CLS-LOC
              test -e /sc-rwx-vol/fedmedcbm/datasets/imagenet_kaggle_download/ILSVRC/Data/CLS-LOC/val || { echo "ERROR: /sc-rwx-vol/fedmedcbm/datasets/imagenet_kaggle_download/ILSVRC/Data/CLS-LOC/val missing"; exit 1; }
              mkdir -p /root/.cache && cp -rn /sc-rwx-vol/fedmedcbm/datasets/torchvision_cifar/. /root/.cache/ 2>/dev/null || true

              for SEED in 7; do
                D=/sc-rwx-vol/fedmedcbm/models/FED_DENSE/imagenet/s$SEED
                if find "$D" -name metrics.txt 2>/dev/null | grep -q .; then
                  echo "[skip] imagenet seed $SEED: already on the PVC"; continue
                fi
                case $SEED in
                  7) NEED="imagenet_train_resnet50_feat_sadf24b6c28db.pt imagenet_train_resnet50_feat_sc4c1ab2d7d51.pt imagenet_val_resnet50_feat_s2c184805042d.pt" ;;
                esac
                for F in $NEED; do
                  if [ ! -f /sc-rwx-vol/fedmedcbm/annotation_cache/$F ]; then echo "ERROR: feature cache /sc-rwx-vol/fedmedcbm/annotation_cache/$F missing"; exit 1; fi
                done
                echo "###### fed_dense | imagenet | dirichlet 0.5 | seed $SEED | CPU ######"
                SAVE=$WORKSPACE/s$SEED
                mkdir -p "$SAVE"
                python baselines/fed_dense/run.py --config baselines/fed_dense/configs/imagenet.yaml \
                  --save_dir "$SAVE" --device cpu --seed $SEED --feature_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache
                MD=$(find "$SAVE/fully_trained" -maxdepth 1 -mindepth 1 -type d | head -1)
                if [ -z "$MD" ]; then echo "ERROR: no model dir produced"; exit 1; fi
                mkdir -p "$D" && cp -r "$MD" "$D/"
                A=$(grep -o '"test_accuracy": [0-9.]*' "$MD/metrics.txt" | head -1 | cut -d' ' -f2)
                awk -v a="$A" -v s=$SEED 'BEGIN{printf "RESULT fed_dense imagenet dirichlet s%s acc=%.2f\n", s, a*100}'
              done
          resources:
            requests:
              cpu: "8"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      restartPolicy: Never
