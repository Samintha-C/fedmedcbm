                  'BEGIN{printf "RESULT vit-b16 cub dir s%s plain FedDualAvg (NEC~50 lambda) acc=%.2f NEC=%.2f\n", s, a*100, nz/k}'

                H=$OUT/dir_s$SEED"_head"
                if find "$H" -name metrics.json 2>/dev/null | grep -q .; then
