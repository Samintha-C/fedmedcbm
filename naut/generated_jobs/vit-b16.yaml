# CLIP ViT-B/16 runs for the supplement: CIFAR-100 and CUB, Dirichlet 0.5, seeds 42 31 7.
# GENERATED BY naut/gen_vit_b16.py -- edit that, not this file.
#
# Code: sandbox-fed-cbm @ 371153a, copied from /sc-rwx-vol/fedmedcbm/sanity_1111/sandbox-fed-cbm.
# One CPU-only Job per dataset; seeds run in sequence. RESUMABLE: each stage is skipped if its output exists.
# Output: /sc-rwx-vol/fedmedcbm/models/VIT_B16/<ds>/dir_s<seed>/<run>/          main_fed.py run (plain FedDualAvg, NEC~50 lambda)
#         /sc-rwx-vol/fedmedcbm/models/VIT_B16/<ds>/dir_s<seed>_head/<run>/     head rule, NEC~5 and ~20 (own_100 entries)
#         /sc-rwx-vol/fedmedcbm/models/VIT_B16/<ds>/dir_s<seed>_t3/<run>/       dense FedAvg / FedProx, FedAvg + l1 threshold at NEC 5 and 20
#         /sc-rwx-vol/fedmedcbm/models/VIT_B16/<ds>/dir_s<seed>_fed_dense/<run>/ FedAvg without a concept layer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vit-b16-cifar100
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-lfc-cbm
    task: vit-b16
    dataset: cifar100
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: cpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update -q && apt-get install -y -q git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              cp -r /sc-rwx-vol/fedmedcbm/sanity_1111/sandbox-fed-cbm $WORKSPACE/fedmedcbm
              COMMIT=$(cat $WORKSPACE/fedmedcbm/SANDBOX_COMMIT)
              echo "sandbox-fed-cbm commit: $COMMIT"
              if [ "$COMMIT" != "371153a" ]; then echo "ERROR: expected sandbox commit 371153a"; exit 1; fi
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM
              git -C $WORKSPACE/Label-free-CBM checkout -q fa2869d

              export OMP_NUM_THREADS=8 MKL_NUM_THREADS=8
              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas scikit-learn pyyaml
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              DS=cifar100
              OUT=/sc-rwx-vol/fedmedcbm/models/VIT_B16/$DS
              mkdir -p $OUT
              mkdir -p /root/.cache && cp -rn /sc-rwx-vol/fedmedcbm/datasets/torchvision_cifar/. /root/.cache/ 2>/dev/null || true
              CHK=""
              if [ -n "$CHK" ] && [ ! -e "$CHK" ]; then echo "ERROR: raw images not reachable at $CHK"; exit 1; fi
              sed -e 's|^backbone: .*|backbone: clip_ViT-B/16|' baselines/fed_dense/configs/$DS.yaml > $WORKSPACE/fed_dense_vit.yaml
              grep -q '^backbone: clip_ViT-B/16$' $WORKSPACE/fed_dense_vit.yaml

              FAILS=""
              for SEED in 42 31 7; do
                D=$OUT/dir_s$SEED
                if find "$D" -name metrics.txt 2>/dev/null | grep -q .; then
                  echo "[skip] $DS seed $SEED: run already on the PVC"
                else
                  echo "###### ViT-B/16 | $DS | dirichlet 0.5 | seed $SEED | main_fed (Phases 1-3) | CPU ######"
                  SAVE=$WORKSPACE/full_s$SEED
                  mkdir -p "$SAVE"
                  set +e
                  python main_fed.py --dataset $DS --concept_file concept_files/cifar100_filtered.txt --backbone clip_ViT-B/16 --clip_name ViT-B/16 \
                    --alpha 0.5 --seed $SEED --save_dir "$SAVE" --dual_lam 0.00086 \
                    --val_split 0.1 --batch_size 32 --cbl_lr 5e-4 --cbl_epochs 3 --cbl_batch_size 32 --cbl_pos_weight 0.2 --num_workers 2 --num_clients 5 --num_rounds 5 --local_epochs 5 --lr 1e-3 --weight_decay 1e-5 --device cpu --use_vlg --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache --log_dir /sc-rwx-vol/fedmedcbm/job_logs --cbl_loss_type bce --cbl_optimizer adam --cbl_hidden_layers 0 --cbl_twoway_tp 4.0 --cbl_bb_lr_rate 1.0 --ortho_lambda 100 --final_layer_method feddualavg --final_rounds 200 --final_epochs 3 --final_lr 1e-3
                  RC=$?; set -e
                  MD=$(find "$SAVE/fully_trained" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
                  if [ $RC -ne 0 ] || [ -z "$MD" ]; then echo "[FAIL] $DS seed $SEED main_fed rc=$RC"; FAILS="$FAILS s$SEED-run"; continue; fi
                  mkdir -p "$D" && cp -r "$MD" "$D/"
                  echo "[ok] -> $D"
                fi
                R=$(find "$D" -name metrics.txt | head -1 | xargs dirname)
                A=$(grep -o '"test_accuracy": [0-9.]*' "$R/metrics.txt" | head -1 | cut -d' ' -f2)
                NZ=$(grep -o '"Non-zero weights": [0-9]*' "$R/metrics.txt" | head -1 | cut -d' ' -f3)
                awk -v a="$A" -v nz="$NZ" -v k=100 -v s=$SEED \
                  'BEGIN{printf "RESULT vit-b16 cifar100 dir s%s plain FedDualAvg (NEC~50 lambda) acc=%.2f NEC=%.2f\n", s, a*100, nz/k}'

                H=$OUT/dir_s$SEED"_head"
                if find "$H" -name metrics.json 2>/dev/null | grep -q .; then
                  echo "[skip] $DS seed $SEED: head rule already on the PVC"
                else
                  echo "###### ViT-B/16 | $DS | seed $SEED | head rule at NEC~5 / ~20 ######"
                  HSAVE=$WORKSPACE/head_s$SEED
                  mkdir -p "$HSAVE"
                  set +e
                  python heads/ours_head.py --dataset $DS --concept_file concept_files/cifar100_filtered.txt --backbone clip_ViT-B/16 --clip_name ViT-B/16 \
                    --val_split 0.1 --num_workers 2 --num_clients 5 --alpha 0.5 --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache --device cpu --extract_batch_size 64 --seed $SEED \
                    --partitions dirichlet --runs dirichlet=$R --save_dir "$HSAVE" \
                    --lam_mults 0.4 0.65 1.0 1.6 2.5 --refit_rounds 100 --supports own \
                    --lam_targets dirichlet.5:0.01 dirichlet.20:0.00228
                  RC=$?; set -e
                  MH=$(find "$HSAVE" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
                  if [ $RC -ne 0 ] || [ -z "$MH" ]; then echo "[FAIL] $DS seed $SEED head rule rc=$RC"; FAILS="$FAILS s$SEED-head"
                  else mkdir -p "$H" && cp -r "$MH" "$H/" && echo "[ok] -> $H"; fi
                fi

                T=$OUT/dir_s$SEED"_t3"
                if find "$T" -name metrics.json 2>/dev/null | grep -q .; then
                  echo "[skip] $DS seed $SEED: Table 3 rows already on the PVC"
                else
                  echo "###### ViT-B/16 | $DS | seed $SEED | Table 3: dense FedAvg / FedProx, FedAvg + l1 threshold ######"
                  TSAVE=$WORKSPACE/t3_s$SEED
                  mkdir -p "$TSAVE"
                  set +e
                  python heads/dense_prune.py --dataset $DS --concept_file concept_files/cifar100_filtered.txt --backbone clip_ViT-B/16 --clip_name ViT-B/16 \
                    --val_split 0.1 --num_workers 2 --num_clients 5 --alpha 0.5 --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache --device cpu --extract_batch_size 64 --seed $SEED \
                    --partitions dirichlet --runs dirichlet=$R --save_dir "$TSAVE" \
                    --parts dense thresh --necs 5 20
                  RC=$?; set -e
                  MT=$(find "$TSAVE" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
                  if [ $RC -ne 0 ] || [ -z "$MT" ]; then echo "[FAIL] $DS seed $SEED Table 3 rc=$RC"; FAILS="$FAILS s$SEED-t3"
                  else mkdir -p "$T" && cp -r "$MT" "$T/" && echo "[ok] -> $T"; fi
                fi

                F=$OUT/dir_s$SEED"_fed_dense"
                if find "$F" -name metrics.txt 2>/dev/null | grep -q .; then
                  echo "[skip] $DS seed $SEED: FedAvg without concepts already on the PVC"
                else
                  echo "###### ViT-B/16 | $DS | seed $SEED | FedAvg without a concept layer ######"
                  FSAVE=$WORKSPACE/fd_s$SEED
                  mkdir -p "$FSAVE"
                  set +e
                  python baselines/fed_dense/run.py --config $WORKSPACE/fed_dense_vit.yaml \
                    --save_dir "$FSAVE" --device cpu --seed $SEED --feature_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache
                  RC=$?; set -e
                  MF=$(find "$FSAVE/fully_trained" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
                  if [ $RC -ne 0 ] || [ -z "$MF" ]; then echo "[FAIL] $DS seed $SEED fed_dense rc=$RC"; FAILS="$FAILS s$SEED-fed_dense"
                  else
                    mkdir -p "$F" && cp -r "$MF" "$F/" && echo "[ok] -> $F"
                    A=$(grep -o '"test_accuracy": [0-9.]*' "$MF/metrics.txt" | head -1 | cut -d' ' -f2)
                    awk -v a="$A" -v s=$SEED 'BEGIN{printf "RESULT vit-b16 cifar100 dir s%s FedAvg without concepts acc=%.2f\n", s, a*100}'
                  fi
                fi
                cp -rn /root/.cache/cifar-* /sc-rwx-vol/fedmedcbm/datasets/torchvision_cifar/ 2>/dev/null || true
              done

              echo ""
              echo "=========== SUMMARY: $DS ==========="
              for SEED in 42 31 7; do python heads/summarize.py $OUT/dir_s$SEED"_head" || true; python heads/summarize.py $OUT/dir_s$SEED"_t3" || true; done
              if [ -n "$FAILS" ]; then echo "FAILED:$FAILS"; exit 1; fi
          resources:
            requests:
              cpu: "8"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 3Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - cph-dgx-node2.humboldt.edu
                      - cph-dgx-node4.humboldt.edu
                      - cph-dgx-node9.humboldt.edu
                      - k8s-haosu-17.sdsc.optiputer.net
                      - nautilus-ext-gpu01.fullerton.edu
                  - key: topology.kubernetes.io/zone
                    operator: NotIn
                    values:
                      - humboldt
      restartPolicy: Never
---
