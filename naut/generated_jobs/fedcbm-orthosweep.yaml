apiVersion: batch/v1
kind: Job
metadata:
  name: fedcbm-ortho-places365-o10000
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-lfc-cbm
    task: ortho-sweep
    dataset: places365
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: gpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update -q && apt-get install -y -q git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM
              git -C $WORKSPACE/Label-free-CBM checkout -q fa2869d

              export OMP_NUM_THREADS=2 MKL_NUM_THREADS=2
              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas scikit-learn scipy
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              DS=places365
              O=10000
              SEED=42
              K=365
              D=/sc-rwx-vol/fedmedcbm/models/ORTHO_SWEEP/$DS/o$O
              REFM=$(find /sc-rwx-vol/fedmedcbm/models/places365/dlamsweep/lam0.0001 -name metrics.txt -print -quit 2>/dev/null || true)
              mkdir -p $D
              export PLACES365_ROOT=/sc-rwx-vol/fedmedcbm/datasets/places365
              : # not CIFAR
              CHK="/sc-rwx-vol/fedmedcbm/datasets/places365/data_256_standard"
              if [ -n "$CHK" ] && [ ! -e "$CHK" ]; then
                echo "ERROR: raw images not reachable at $CHK"; exit 1
              fi
              NF=0

              echo ""
              echo "############ $DS | ortho_lambda $O | dirichlet 0.5 | seed $SEED ############"
              # 1. full pipeline; Phase 3 at the tab:main NEC~50 lambda
              if [ -n "$(find $D -mindepth 2 -maxdepth 2 -name metrics.txt -print -quit)" ]; then
                echo "[skip] main_fed.py"
              else
                SAVE=$WORKSPACE/run
                mkdir -p $SAVE
                python main_fed.py --dataset $DS --concept_file concept_files/places365_filtered.txt --backbone resnet50 --clip_name ViT-B/16 --feature_layer layer4 \
                  --alpha 0.5 --seed $SEED --save_dir $SAVE --dual_lam 0.0001 \
                  --val_split 0.05 --batch_size 128 --cbl_lr 5e-4 --cbl_epochs 4 --cbl_batch_size 128 --cbl_pos_weight 50 --num_workers 8 --num_clients 5 --num_rounds 5 --local_epochs 5 --lr 1e-3 --weight_decay 1e-5 --device cuda --use_vlg --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache --log_dir /sc-rwx-vol/fedmedcbm/job_logs --cbl_loss_type bce --cbl_optimizer adam --cbl_hidden_layers 0 --cbl_twoway_tp 4.0 --cbl_bb_lr_rate 1.0 --ortho_lambda $O --final_layer_method feddualavg --final_rounds 1 --final_epochs 3 --final_lr 1e-3 --no_nec_eval
                MD=$(find $SAVE/fully_trained -maxdepth 1 -mindepth 1 -type d | head -1)
                if [ -z "$MD" ]; then echo "ERROR: main_fed.py left no model dir"; exit 1; fi
                cp -r "$MD" $D/
                echo "[ok] main_fed.py -> $D/$(basename $MD)"
              fi
              RUN=$(dirname "$(find $D -mindepth 2 -maxdepth 2 -name cbl.pt -print -quit)")

              # 2. geometry of the CBL rows (what the penalty acts on)
              if [ -e $D/cbl_weight_geometry.json ]; then
                echo "[skip] weight geometry"
              else
                python -c "import json,sys,torch,torch.nn.functional as F; W=torch.load(sys.argv[1],map_location='cpu')['model.0.weight'].float(); C=W.shape[0]; I=torch.eye(C); Wn=F.normalize(W,dim=1); G=Wn@Wn.T; off=G[I==0].abs(); s=torch.linalg.svdvals(W); p=s/s.sum(); json.dump({'num_concepts':C,'L_ortho':float((G-I).pow(2).mean()),'mean_abs_cos':float(off.mean()),'max_abs_cos':float(off.max()),'frac_abs_cos_above_0.5':float((off>0.5).float().mean()),'eff_rank_W':float(torch.exp(-(p*p.clamp_min(1e-12).log()).sum()))},open(sys.argv[2],'w'),indent=2)" $RUN/cbl.pt $D/cbl_weight_geometry.json \
                  || { echo "[FAIL] weight geometry"; NF=$((NF+1)); }
              fi

              # 3. evaluate_cbl.py not run here: two passes over the test JPEGs on NFS would
              #    idle the GPU for 1-2 h (see naut/gen_ortho_sweep.py).
              echo "[skip] evaluate_cbl.py (GPU dataset)"

              # 4. the head rule at NEC~5 and NEC~50
              if [ -n "$(find $D/head -name metrics.json -print -quit 2>/dev/null)" ]; then
                echo "[skip] ours_head.py"
              else
                python baselines/fedcbm_reimpl/ours_head.py --dataset $DS --concept_file concept_files/places365_filtered.txt --backbone resnet50 --clip_name ViT-B/16 --feature_layer layer4 \
                  --val_split 0.05 --num_workers 8 --seed $SEED --num_clients 5 --alpha 0.5 \
                  --partitions dirichlet \
                  --annotation_dir /sc-rwx-vol/fedmedcbm/annotations \
                  --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache \
                  --save_dir $WORKSPACE/head --device cuda --runs dirichlet=$RUN \
                  --supports own --refit_rounds 100 --lam_targets iid.5:0.001 iid.50:0.000122 dirichlet.5:0.001 dirichlet.50:0.0001 \
                  && mkdir -p $D/head && cp -r $WORKSPACE/head/. $D/head/ \
                  || { echo "[FAIL] ours_head.py"; NF=$((NF+1)); }
              fi

              echo ""
              echo "=========== SUMMARY: $DS ortho_lambda $O ==========="
              A=$(grep -o '"test_accuracy": [0-9.]*' $REFM | head -1 | cut -d' ' -f2)
              NZ=$(grep -o '"Non-zero weights": [0-9]*' $REFM | head -1 | cut -d' ' -f3)
              awk -v n="$REFM" -v a="$A" -v nz="$NZ" -v k=$K \
                'BEGIN{printf "  tab:main (ortho 100) FedDualAvg acc=%6.2f  NEC=%6.2f  %s\n", a*100, nz/k, n}'
              echo "  main_fed.py ran 1 Phase-3 round here; this run's FedDualAvg is the fda lines above"
              cat $D/cbl_weight_geometry.json 2>/dev/null || true
              grep -E '^  "(mean_auc_roc|mean_f1_optimal)"|"(effective_rank|mean_abs_pairwise_corr|mean_cohens_d)"' \
                $D/cbl_eval_dino.json 2>/dev/null || true
              if [ $NF -gt 0 ]; then echo "ERROR: $NF step(s) failed"; exit 1; fi
          resources:
            requests:
              cpu: "2"
              memory: "48Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "48Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # all >= 24 GB; 11-16 GB cards left out (ImageNet's per-client heads).
                      # A40 / A100 need their own resource names on NRP, so they are not listed.
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-A10
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-L4
                      - Quadro-RTX-6000
                      - NVIDIA-RTX-A5000
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nautilus-ext-gpu01.fullerton.edu  # "GPU is lost" admission errors, 2026-10-15
      restartPolicy: Never
---
