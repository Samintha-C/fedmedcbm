              for D in $(ls -d $OUT/*/ 2>/dev/null | sort); do
                M=$(find "$D" -name metrics.txt | head -1); [ -z "$M" ] && continue
                A=$(grep -o '"test_accuracy": [0-9.]*' "$M" | head -1 | cut -d' ' -f2)
                NZ=$(grep -o '"Non-zero weights": [0-9]*' "$M" | head -1 | cut -d' ' -f3)
                awk -v n="$(basename $D)" -v a="$A" -v nz="$NZ" -v k=200 \
                  'BEGIN{printf "  %-28s acc=%6.2f  NEC=%8.2f\n", n, a*100, nz/k}'
              done
              echo "$NDONE/6 cells have results."
              if [ "$NDONE" -eq 0 ]; then echo "ERROR: no cell produced results"; exit 1; fi
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 6Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-A10
                      - NVIDIA-A40
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-PCIE-40GB
      restartPolicy: Never
