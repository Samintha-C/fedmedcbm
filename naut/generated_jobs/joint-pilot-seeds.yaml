# Joint-CBM pilot: CBL + dense head trained jointly in Phase 1, then our head rule.
# GENERATED BY naut/gen_joint_pilot.py -- edit that, not this file.
#
# One CPU-only Job per (dataset, gamma, seed); seeds 31 7, Dirichlet alpha 0.5. No GPU is requested.
# RESUMABLE: each stage is skipped if its output is already on the PVC.
# Output: /sc-rwx-vol/fedmedcbm/models/JOINT_PILOT/<dataset>/g<gamma>_dir_s<seed>/<run>/       (main_fed.py run, joint_head.pt)
#         /sc-rwx-vol/fedmedcbm/models/JOINT_PILOT/<dataset>/g<gamma>_dir_s<seed>_head/<run>/  (ours_head.py metrics.json)
# Needs the --joint_cbm commit pushed to Samintha-C/fedmedcbm before apply.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: joint-pilot-cifar10-g05-s31
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-lfc-cbm
    task: joint-pilot
    dataset: cifar10
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: cpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update -q && apt-get install -y -q git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM
              git -C $WORKSPACE/Label-free-CBM checkout -q fa2869d

              export OMP_NUM_THREADS=8 MKL_NUM_THREADS=8
              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas scikit-learn
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              OUT=/sc-rwx-vol/fedmedcbm/models/JOINT_PILOT/cifar10
              D=$OUT/g05_dir_s31
              H=$OUT/g05_dir_s31_head
              mkdir -p $OUT
              mkdir -p /root/.cache && cp -rn /sc-rwx-vol/fedmedcbm/datasets/torchvision_cifar/. /root/.cache/ 2>/dev/null || true

              if find "$D" -name metrics.txt 2>/dev/null | grep -q .; then
                echo "[skip] cifar10 gamma 0.5: joint run already on the PVC"
              else
                echo "###### cifar10 | dirichlet 0.5 | seed 31 | joint CBM gamma 0.5 | CPU ######"
                SAVE=$WORKSPACE/full
                mkdir -p "$SAVE"
                python main_fed.py --dataset cifar10 --concept_file concept_files/cifar10_filtered.txt --backbone clip_RN50 --use_clip_penultimate --clip_name RN50 \
                  --alpha 0.5 --seed 31 --save_dir "$SAVE" --dual_lam 0.0013 \
                  --joint_cbm --joint_gamma 0.5 \
                  --val_split 0.1 --batch_size 32 --cbl_lr 5e-4 --cbl_epochs 5 --cbl_batch_size 32 --cbl_pos_weight 0.2 --num_workers 2 --num_clients 5 --num_rounds 5 --local_epochs 5 --lr 1e-3 --weight_decay 1e-5 --device cpu --use_vlg --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache --log_dir /sc-rwx-vol/fedmedcbm/job_logs --cbl_loss_type bce --cbl_optimizer adam --cbl_hidden_layers 0 --cbl_twoway_tp 4.0 --cbl_bb_lr_rate 1.0 --ortho_lambda 100 --final_layer_method feddualavg --final_rounds 200 --final_epochs 3 --final_lr 1e-3 --no_nec_eval
                MD=$(find "$SAVE/fully_trained" -maxdepth 1 -mindepth 1 -type d | head -1)
                if [ -z "$MD" ]; then echo "ERROR: no model dir produced"; exit 1; fi
                mkdir -p "$D" && cp -r "$MD" "$D/"
                echo "[ok] -> $D"
              fi
              M=$(find "$D" -name metrics.txt | head -1)
              A=$(grep -o '"test_accuracy": [0-9.]*' "$M" | head -1 | cut -d' ' -f2)
              J=$(grep -o '"joint_head_test_accuracy": [0-9.]*' "$M" | head -1 | cut -d' ' -f2)
              NZ=$(grep -o '"Non-zero weights": [0-9]*' "$M" | head -1 | cut -d' ' -f3)
              awk -v a="$A" -v j="$J" -v nz="$NZ" -v k=10 \
                'BEGIN{printf "RESULT cifar10 g0.5 plain FedDualAvg acc=%.2f NEC=%.2f | joint dense head acc=%.2f\n", a*100, nz/k, j*100}'

              if find "$H" -name metrics.json 2>/dev/null | grep -q .; then
                echo "[skip] cifar10 gamma 0.5: head rule already on the PVC"; exit 0
              fi
              echo "###### cifar10 | gamma 0.5 | head rule (FedDualAvg -> own-support refit) | CPU ######"
              HSAVE=$WORKSPACE/head
              mkdir -p "$HSAVE"
              python baselines/fedcbm_reimpl/ours_head.py --dataset cifar10 --concept_file concept_files/cifar10_filtered.txt --backbone clip_RN50 --use_clip_penultimate --clip_name RN50 \
                --val_split 0.1 --num_workers 2 --seed 31 --num_clients 5 --alpha 0.5 \
                --partitions dirichlet \
                --annotation_dir /sc-rwx-vol/fedmedcbm/annotations \
                --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache \
                --save_dir "$HSAVE" --device cpu --runs dirichlet=$D \
                --lam_mults 0.6 1.0 1.6 --refit_rounds 100 --supports own \
                --lam_targets dirichlet.5:0.022 dirichlet.50:0.0013
              MH=$(find "$HSAVE" -maxdepth 1 -mindepth 1 -type d | head -1)
              if [ -z "$MH" ]; then echo "ERROR: no head-rule output"; exit 1; fi
              mkdir -p "$H" && cp -r "$MH" "$H/"
              echo "[ok] -> $H"
          resources:
            requests:
              cpu: "8"
              memory: "6Gi"
            limits:
              cpu: "8"
              memory: "6Gi"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      restartPolicy: Never
---
