apiVersion: batch/v1
kind: Job
metadata:
  name: joint-g099-imagenet-s7
  namespace: wenglab-interpretable-ai
  labels:
    experiment: fed-lfc-cbm
    task: joint-g099
    dataset: imagenet
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: gpu-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              apt-get update -q && apt-get install -y -q git

              WORKSPACE=/tmp/workspace
              mkdir -p $WORKSPACE && cd $WORKSPACE
              git clone https://github.com/Samintha-C/fedmedcbm.git $WORKSPACE/fedmedcbm
              git clone https://github.com/Trustworthy-ML-Lab/Label-free-CBM.git $WORKSPACE/Label-free-CBM
              git -C $WORKSPACE/Label-free-CBM checkout -q fa2869d

              export OMP_NUM_THREADS=2 MKL_NUM_THREADS=2
              export PIP_CACHE_DIR=/tmp/pip-cache
              mkdir -p $PIP_CACHE_DIR
              pip install --cache-dir $PIP_CACHE_DIR -q ftfy regex tqdm numpy pandas scikit-learn
              pip install --cache-dir $PIP_CACHE_DIR -q git+https://github.com/openai/CLIP.git
              pip install --cache-dir $PIP_CACHE_DIR -q pytorchcv || true
              pip install --cache-dir $PIP_CACHE_DIR -q psutil || true

              cd $WORKSPACE/fedmedcbm
              export IMAGENET_ROOT=/sc-rwx-vol/fedmedcbm/datasets/imagenet_kaggle_download/ILSVRC/Data/CLS-LOC
              test -e /sc-rwx-vol/fedmedcbm/datasets/imagenet_kaggle_download/ILSVRC/Data/CLS-LOC/val || { echo "ERROR: /sc-rwx-vol/fedmedcbm/datasets/imagenet_kaggle_download/ILSVRC/Data/CLS-LOC/val missing"; exit 1; }
              mkdir -p /root/.cache && cp -rn /sc-rwx-vol/fedmedcbm/datasets/torchvision_cifar/. /root/.cache/ 2>/dev/null || true
              OUT=/sc-rwx-vol/fedmedcbm/models/JOINT_PILOT/imagenet
              D=$OUT/g099_dir_s7
              H=$OUT/g099_dir_s7_head

              if find "$D" -name metrics.txt 2>/dev/null | grep -q .; then
                echo "[skip] imagenet seed 7: joint run already on the PVC"
              else
                echo "###### imagenet | dirichlet 0.5 | seed 7 | joint CBM gamma 0.99 | GPU ######"
                SAVE=$WORKSPACE/full
                mkdir -p "$SAVE"
                python main_fed.py --dataset imagenet --concept_file concept_files/imagenet_filtered.txt --backbone resnet50 --clip_name ViT-B/16 --feature_layer layer4 \
                  --alpha 0.5 --seed 7 --save_dir "$SAVE" --dual_lam 0.000077 \
                  --joint_cbm --joint_gamma 0.99 \
                  --val_split 0.05 --batch_size 64 --cbl_lr 0.01 --cbl_epochs 7 --cbl_batch_size 64 --cbl_pos_weight 8000.0 --num_workers 8 --num_clients 5 --num_rounds 5 --local_epochs 5 --lr 1e-3 --weight_decay 1e-5 --device cuda --use_vlg --annotation_dir /sc-rwx-vol/fedmedcbm/annotations --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache --log_dir /sc-rwx-vol/fedmedcbm/job_logs --cbl_loss_type bce --cbl_optimizer adam --cbl_hidden_layers 0 --cbl_twoway_tp 4.0 --cbl_bb_lr_rate 1.0 --ortho_lambda 100 --final_layer_method feddualavg --final_rounds 200 --final_epochs 3 --final_lr 1e-3 --no_nec_eval --final_rounds 1
                MD=$(find "$SAVE/fully_trained" -maxdepth 1 -mindepth 1 -type d | head -1)
                if [ -z "$MD" ]; then echo "ERROR: no model dir produced"; exit 1; fi
                mkdir -p "$D" && cp -r "$MD" "$D/"
                echo "[ok] -> $D"
              fi
              M=$(find "$D" -name metrics.txt | head -1)
              J=$(grep -o '"joint_head_test_accuracy": [0-9.]*' "$M" | head -1 | cut -d' ' -f2)
              awk -v j="$J" 'BEGIN{printf "RESULT imagenet g0.99 s7 joint dense head acc=%.2f\n", j*100}'

              if find "$H" -name metrics.json 2>/dev/null | grep -q .; then
                echo "[skip] imagenet seed 7: head rule already on the PVC"; exit 0
              fi
              if ! find "$D" -name metrics.txt 2>/dev/null | grep -q .; then
                echo "ERROR: no joint run at $D"; exit 1
              fi
              echo "###### imagenet | gamma 0.99 | seed 7 | head rule, lam x (0.6 1.0 1.6) | GPU ######"
              HSAVE=$WORKSPACE/head
              mkdir -p "$HSAVE"
              python baselines/fedcbm_reimpl/ours_head.py --dataset imagenet --concept_file concept_files/imagenet_filtered.txt --backbone resnet50 --clip_name ViT-B/16 --feature_layer layer4 \
                --val_split 0.05 --num_workers 8 --seed 7 --num_clients 5 --alpha 0.5 \
                --partitions dirichlet \
                --annotation_dir /sc-rwx-vol/fedmedcbm/annotations \
                --annotation_cache_dir /sc-rwx-vol/fedmedcbm/annotation_cache \
                --save_dir "$HSAVE" --device cuda --runs dirichlet=$D \
                --lam_mults 0.6 1.0 1.6 --refit_rounds 100 --supports own \
                --lam_targets dirichlet.5:0.0005
              MH=$(find "$HSAVE" -maxdepth 1 -mindepth 1 -type d | head -1)
              if [ -z "$MH" ]; then echo "ERROR: no head-rule output"; exit 1; fi
              mkdir -p "$H" && cp -r "$MH" "$H/"
              echo "[ok] -> $H"
          resources:
            requests:
              cpu: "2"
              memory: "48Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "48Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: sc-rwx-vol
              mountPath: /sc-rwx-vol
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: sc-rwx-vol
          persistentVolumeClaim:
            claimName: sc-rwx-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # as ours-head-nec1020 / local-cbm-indep-large: all >= 24 GB
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-A10
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-L4
                      - Quadro-RTX-6000
                      - NVIDIA-RTX-A5000
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nautilus-ext-gpu01.fullerton.edu  # "GPU is lost" admission errors, 2026-10-15
      restartPolicy: Never
